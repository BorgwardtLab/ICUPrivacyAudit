defaults:
  - numerical_workflow
  - _self_

output_dir: outputs/numerical_smoke
data:
  max_patients: 256
  max_hours: 6
  max_tokens: 64
  features: [hr_raw, temp_raw]
  demographics: [female_static, age_static]
model:
  config:
    hidden_size: 16
    intermediate_size: 32
    num_hidden_layers: 1
    num_attention_heads: 2
    num_key_value_heads: 2
train:
  batch_size: 4
  max_steps: 1
  accelerator: cpu
  limit_val_batches: 1
generate:
  num_samples: 16
  batch_size: 4
  max_new_tokens: 32
  device: cpu
evaluate:
  max_hours: 6
