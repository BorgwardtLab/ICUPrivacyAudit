defaults:
  - _self_
  - datamodule: icuall # name of the yaml file with the spec of the dataset you want to use, should be in the datamodule folder
  - paths: local # auto-detect cluster and user

seed: 0
wandb: false

trainer:
  _target_: lightning.Trainer
  accelerator: auto
  precision: bf16-true
  max_steps: 200000
  log_every_n_steps: 100
  max_epochs: 100
  val_check_interval: 1000
  check_val_every_n_epoch: null
  gradient_clip_val: 0.11856150495414686 #1.0
  strategy: ddp #auto
  devices: 2 #auto
  num_nodes: 1
  default_root_dir: ${logs.path}
  num_sanity_val_steps: 0
  accumulate_grad_batches: 8

train:
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.0021649915375620173 #0.001
    weight_decay: 0.04739107925821598 #0.1
    betas: [0.9, 0.95]
  lr_scheduler:
    _target_: transformers.get_cosine_schedule_with_warmup
    num_warmup_steps: ${eval:0.01 * ${trainer.max_steps}}
    num_training_steps: ${trainer.max_steps}

model:
  _target_: syntheticicu.model_gap.get_llama_model
  model_name: llama-xs 
  attention_dropout: 0.33657881463675005 #0.5
  pretrained_path: null
  label_dropout: 0.1
  prefix_token_count: 1
  num_classes: 2
  num_centers: 6          
  center_dropout_prob: 0.3

ckpt_name: ${model.model_name} # checkpoint file name, without .ckpt
resume_every_n_epochs: 1 # save a resume checkpoint (latest only) every N epochs; a rerun with the same logs.path continues from it

logs:
  prefix: ${paths.logs.train}/${datamodule.dataset_name}/${model.model_name}/${seed}
  path: ${logs.prefix}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}


# output directory, generated dynamically on each run
hydra:
  run:
    dir: ${logs.path}
  sweep:
    dir: ${logs.prefix}/multiruns/train/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
