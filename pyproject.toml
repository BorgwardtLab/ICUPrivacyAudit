[project]
name = "syntheticicu"
version = "0.2.0"
description = "Privacy auditing with measured detection floors for ICU trajectory generators (RECOMB27)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "BSD-3-Clause" }
authors = [{ name = "SyntheticICUAugmentation authors" }]
dependencies = [
    "hydra-core>=1.3.2,<2",
    "omegaconf>=2.3,<3",
    "torch>=2.6,<3",
    "lightning>=2.5,<3",
    "transformers>=4.57,<5",
    "numpy>=2.0,<2.3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.6,<2",
    "scikit-optimize>=0.10.2,<0.11",
    "joblib>=1.4,<2",
    "pyarrow>=21,<22",
    "numba>=0.61,<0.62",
    "rapidfuzz>=3,<4",
    "sparse>=0.15,<1",
    "statsmodels>=0.14.5,<0.15",
    "sdv>=1.22,<2",
    "matplotlib>=3.10,<4",
    "tqdm>=4.67,<5",
    "pyyaml>=6,<7",
    "lz4>=4.4,<5",
]

[tool.poetry]
packages = [{ include = "syntheticicu" }]

[dependency-groups]
dev = ["pytest>=9,<10", "hypothesis>=6.155,<7", "black>=25,<26"]

[tool.black]
line-length = 88
target-version = ['py311', 'py312']

[tool.pytest.ini_options]
testpaths = ["quack"]

[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
